<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Importando as fontes necessárias -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <title>Agendamento de Serviços</title>
  <link rel="stylesheet" href="contato.css"> <!-- Link para o CSS separado -->
</head>
<body>
  <div class="App">
    <div class="background-image"></div>
    <div class="button-container">
      <h1>Informe seus Dados</h1>
      <form id="formAgendamento" onsubmit="return false;">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" class="input-padrao" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" class="input-padrao" required>

        <button type="button" id="mostrarDatasBtn" class="servico-button">Mostrar Datas Disponíveis</button>
        <div class="datas-disponiveis" id="datasDisponiveis"></div>

        <button type="button" id="mostrarHorariosBtn" class="servico-button" style="display: none;">Mostrar Horários Disponíveis</button>
        <div class="horarios-disponiveis" id="horariosDisponiveis" style="display: none;">
          <div id="horariosContainer" style="display: none;"></div>
        </div>

        <button type="submit" id="confirmarBtn" class="servico-button">Confirmar Agendamento</button>
      </form>
      <div id="detalhesAgendamento"></div>
    </div>
  </div>
  <script src="script.jsx"></script>
</body>
</html>
